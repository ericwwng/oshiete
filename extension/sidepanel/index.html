<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oshiete</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="brand"><img src="logo.svg" alt="教えて logo" /><div><h1>Oshiete <span lang="ja">教えて</span></h1><p>Japanese grammar, made understandable.</p></div></div>
      <a href="../options/index.html" target="_blank">Settings</a>
    </header>
    <main>
      <label for="selection">Selected text</label>
      <textarea id="selection" rows="4" placeholder="Paste Japanese text here, then click Analyze."></textarea>
      <button id="analyze">Analyze</button>
      <p id="status" role="status"></p>
      <section id="result" aria-live="polite"></section>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
