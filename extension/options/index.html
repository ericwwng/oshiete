<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oshiete Settings</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Oshiete settings</h1>
      <p>Your key is stored locally in this Chrome profile and is sent to your configured analysis server when you request an analysis. It is not synced.</p>
      <label for="apiKey">OpenAI API key</label>
      <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-…" />
      <div class="actions"><button id="save">Save key</button><button id="clear" class="secondary">Clear</button></div>
      <p id="status" role="status"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
